<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grass Bank™</title>
<link rel="canonical" href="https://thegrassbank.com/">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="stylesheet" href="/fonts/fonts-opsz.css">
<!--
  comingsoon.html — RETIRED as a page 2026-11-26, the day the site opened to
  the public (minimumTier = public). The launch-day page is archived in
  cricket-times-notes: business-records/2026-11-26-comingsoon-page-final.png.

  WHY THE FILE STAYS: it is still the safe fallback. Every gated page's
  injected watchdog sends a visitor here if the site's access settings
  haven't loaded within 2.5 s, and feature-flags.js's denyTarget sends a page
  that is in no featureGates bucket here. That's ~6,000 files, so the
  address is kept and only the page changes.

  WHAT IT DOES NOW:
  - Arrived from another page on this site (the fallback): say plainly that
    the page didn't load, with "Try again" (back to that page) and the home
    page. It never redirects by itself in this case, so a page that keeps
    failing can't bounce a reader back and forth.
  - Arrived any other way (typed, an old link, a bookmark, search): go
    straight to the home page.
  - Loop guard: if we sent this tab home in the last 30 seconds and it came
    back here, show the message instead of sending it home again.
-->
<style>
  :root { --cream:#fdf7e8; --ink:#1a1208; --ink-light:#6b5e4a; --crimson:#8b1a1a; --green:#4f7f2c; --rule:#d4c9b0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--cream); color:var(--ink); font-family:'Source Serif 4',Georgia,serif; line-height:1.6;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; text-align:center; padding:34px 20px 18px; border-bottom:2px solid var(--ink); }
  .brand { font-family:'Playfair Display',Georgia,serif; font-weight:900; font-size:clamp(34px,7vw,54px); letter-spacing:-0.01em; }
  .brand .g { color:var(--green); } .brand .b { color:var(--crimson); }
  .brand sup { font-size:0.3em; vertical-align:top; position:relative; top:0.4em; }
  main { max-width:520px; padding:56px 24px; text-align:center; display:none; }
  h1 { font-family:'Playfair Display',Georgia,serif; font-size:30px; line-height:1.2; margin-bottom:12px; }
  p { color:var(--ink-light); font-size:17px; }
  .row { margin-top:26px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn { display:inline-block; text-decoration:none; font-size:13px; letter-spacing:0.12em; text-transform:uppercase;
         padding:11px 20px; border:1px solid var(--crimson); color:var(--crimson); }
  .btn.solid { background:var(--crimson); color:var(--cream); }
</style>
<script>
(function () {
  var KEY = 'ct_cs_home_at';
  var from = null;
  try {
    var u = new URL(document.referrer);
    if (u.origin === location.origin && !/\/comingsoon\.html$/.test(u.pathname)) from = u.pathname + u.search + u.hash;
  } catch (e) { /* no referrer */ }
  var recent = false;
  try { recent = Date.now() - Number(sessionStorage.getItem(KEY) || 0) < 30000; } catch (e) {}
  if (!from && !recent) {
    try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}
    location.replace('/');
    return;
  }
  window.__ctRetry = from || '/';
})();
</script>
</head>
<body>
<header>
  <div class="brand">The <span class="g">Grass</span> <span class="b">Bank</span><sup>™</sup></div>
</header>
<main id="msg">
  <h1>That page didn&rsquo;t load</h1>
  <p>Something got in the way while it was opening, usually a slow connection. Please try again.</p>
  <div class="row">
    <a class="btn solid" id="retry" href="/">Try again</a>
    <a class="btn" href="/">Home page</a>
  </div>
</main>
<script>
  if (window.__ctRetry) {
    document.getElementById('retry').setAttribute('href', window.__ctRetry);
    document.getElementById('msg').style.display = 'block';
  }
</script>
</body>
</html>
