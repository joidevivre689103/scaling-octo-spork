<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf9f7;--surface:#ffffff;--surface2:#f5f4f2;--surface3:#eceae6;
  --border:#d8d4cc;--border2:#c8c4bc;
  --text:#1a1a18;--text2:#4a4a46;--text3:#7a7a74;
  --accent:#a03020;--accent-hover:#801810;--accent-dim:rgba(160,48,32,0.08);
  --green:#1a6848;--green-dim:rgba(26,104,72,0.10);
  --gold:#8a6a1a;--gold-dim:rgba(138,106,26,0.10);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden}
.main{max-width:1000px;margin:0 auto;padding:28px 32px 64px}
.page-title{font-family:'DM Serif Display',serif;font-size:34px;letter-spacing:-0.4px;margin-bottom:8px}
.page-desc{font-size:16px;line-height:1.55;color:var(--text2);max-width:660px}
.fx-filter{display:flex;gap:10px;align-items:center;margin:22px 0 6px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text2)}
.fx-filter select{font:inherit;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)}
.fx-month{font-family:'DM Serif Display',serif;font-size:24px;margin:30px 0 10px;padding-top:10px;border-top:2px solid var(--text)}
.fx-list{list-style:none}
.fx-row{display:grid;grid-template-columns:118px 1fr auto;gap:16px;align-items:baseline;padding:13px 0;border-top:1px solid var(--surface3)}
.fx-row:first-child{border-top:none}
.fx-date{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--text2)}
.fx-teams{font-family:'DM Serif Display',serif;font-size:20px;line-height:1.2}
.fx-sub{font-size:14px;color:var(--text3);margin-top:3px}
.fx-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fx-tag{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.3px;padding:3px 9px;border-radius:12px;white-space:nowrap}
.fx-wtc{background:var(--green-dim);color:var(--green)}
.fx-tbc{background:var(--surface2);color:var(--text3)}
.fx-live{background:var(--accent);color:#fff;text-decoration:none}
.fx-note{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--text3);margin-top:26px;line-height:1.5}
.fx-empty{font-size:15px;color:var(--text2);margin-top:24px}
/* "Who will win?" (IJ, 2026-11-25): the State of play picker, on the next Tests */
.fx-pick{margin-top:8px;font-family:'Inter',sans-serif}
.fx-q{display:inline;font-size:13px;font-weight:600;color:var(--text);margin-right:8px}
.fx-guesses{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle}
.fx-guess{font-family:'Inter',sans-serif;font-size:11.5px;padding:5px 9px;border:1px solid var(--border2);border-radius:3px;background:var(--bg);color:var(--text);cursor:pointer;line-height:1.2}
.fx-guess:hover,.fx-guess:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.fx-answer{font-size:13px;line-height:1.45;color:var(--text)}
.fx-answer b{color:var(--text2)}
@media(max-width:600px){
  .main{padding:20px 16px 48px}
  .page-title{font-size:28px}
  .fx-row{grid-template-columns:1fr;gap:4px}
  .fx-tags{justify-content:flex-start}
}

<body>
<header data-ct-nav="masthead"></header>
<nav data-ct-nav="primary"></nav>
<main class="main">
  <h1 class="page-title">Fixtures</h1>
  <p class="page-desc">Every men’s Test coming up: when, where, and which count for the World Test Championship.</p>
  <div class="fx-filter"><label for="fxTeam">Team</label>
    <select id="fxTeam"><option value="">All teams</option></select></div>
  <div id="fxList"><p class="fx-empty">Loading fixtures…</p></div>
  <p class="fx-note" id="fxNote" hidden></p>
  <noscript><p class="page-desc">The fixtures need JavaScript.</p></noscript>

<script>
(function () {
  // liveScores/fixtures: our own list (published by the backend's
  // scripts/publish_fixtures.py). Dates are each Test's local first day.
  // Built with textContent only.
  const $ = id => document.getElementById(id);
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August',
    'September', 'October', 'November', 'December'];
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const dayOf = s => new Date(s + 'T12:00:00Z');
  const fmtDay = s => dayOf(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
  const monthKey = t => (t.start || t.month || '').slice(0, 7);
  const monthName = k => MONTHS[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4);
  const today = new Date().toISOString().slice(0, 10);
  let TESTS = [], LIVE = [];

  // A Test that has started and isn't over: from State of play, so the page
  // never guesses. Matched by its two teams and a first day within two days.
  function liveFor(t) {
    const k = [t.host, t.visitor].map(x => String(x).toLowerCase()).sort().join('|');
    return LIVE.find(m => m.tier === 'test' && m.state === 'live'
      && (m.teams || []).map(x => String(x).toLowerCase()).sort().join('|') === k
      && Math.abs(Date.parse(String(m.startsAt).slice(0, 10)) - Date.parse(t.start)) <= 2 * 864e5);
  }

  // "Who will win?" (IJ, 2026-11-25). The same pick as State of play's cards
  // on the homepage, offered here for the Tests starting in the next 30 days
  // and any in play. Kept in this browser only: nothing is sent, counted or
  // shown as odds. A pick is saved under the fixture key below (and under
  // State of play's own key when the Test is already on it), and the
  // homepage reads the fixture key too, so a call made here shows there
  // once the Test starts, and says whether the reader called it at the end.
  const PICK_DAYS = 30;
  const REPLIES = ['Bold. We\u2019ll hold you to it.', 'Noted. Watch this space.', 'Brave call. Let\u2019s see.'];
  const pickKey = t => 'tgb-pick-' + [t.host, t.visitor].map(x => String(x).toLowerCase()).sort().join('|') + '|' + t.start;
  const getPick = (keys) => { for (const k of keys) { try { const v = localStorage.getItem(k); if (v) return v; } catch (e) { /* private mode */ } } return null; };
  function pickBox(t, live, sop) {
    if (!t.start || /tentative/i.test(t.status || '')) return null;
    const soon = (Date.parse(t.start) - Date.parse(today)) <= PICK_DAYS * 864e5;
    if (!soon && !live) return null;
    const keys = [pickKey(t)].concat(sop ? ['tgb-sop-pick-' + sop.matchId] : []);
    const wrap = el('div', 'fx-pick');
    const name = p => p === 'draw' ? 'a draw' : p;
    const reply = p => {
      wrap.textContent = '';
      const line = el('p', 'fx-answer');
      line.appendChild(el('b', '', 'You picked ' + name(p) + '. '));
      const i = Math.abs([...keys[0]].reduce((a, c) => a + c.charCodeAt(0), 0)) % REPLIES.length;
      line.appendChild(document.createTextNode(p === 'draw' ? 'Boring or thriller? Watch this space.' : REPLIES[i]));
      wrap.appendChild(line);
    };
    const had = getPick(keys);
    if (had) { reply(had); return wrap; }
    wrap.appendChild(el('p', 'fx-q', 'Who will win?'));
    const row = el('span', 'fx-guesses');
    [t.host, t.visitor, 'Draw'].forEach((label, i) => {
      const b = el('button', 'fx-guess', label);
      b.type = 'button';
      b.addEventListener('click', () => {
        const p = i === 0 ? t.host : i === 1 ? t.visitor : 'draw';
        keys.forEach(k => { try { localStorage.setItem(k, p); } catch (e) { /* fine without it */ } });
        reply(p);
      });
      row.appendChild(b);
    });
    wrap.appendChild(row);
    return wrap;
  }

  // The same Test on State of play (upcoming or live), for its pick key.
  function sopFor(t) {
    const k = [t.host, t.visitor].map(x => String(x).toLowerCase()).sort().join('|');
    return LIVE.find(m => m.tier === 'test' && m.matchId
      && (m.teams || []).map(x => String(x).toLowerCase()).sort().join('|') === k
      && Math.abs(Date.parse(String(m.startsAt).slice(0, 10)) - Date.parse(t.start)) <= 2 * 864e5);
  }

  function render() {
    const team = $('fxTeam').value;
    const box = $('fxList');
    box.textContent = '';
    // Upcoming Tests, plus any still in play (State of play says so).
    const rows = TESTS.filter(t => !t.cancelled && !/cancel/i.test(t.status || '')
      && (!team || t.host === team || t.visitor === team)
      && ((t.start ? t.start >= today : monthKey(t) >= today.slice(0, 7)) || (t.start && liveFor(t))));
    if (!rows.length) { box.appendChild(el('p', 'fx-empty', team ? 'No Tests coming up for ' + team + ' on the list yet.' : 'No Tests on the list yet.')); return; }
    let month = null, ul = null;
    rows.forEach(t => {
      const mk = monthKey(t);
      if (mk !== month) {
        month = mk;
        box.appendChild(el('h2', 'fx-month', monthName(mk)));
        ul = el('ul', 'fx-list');
        box.appendChild(ul);
      }
      const li = el('li', 'fx-row');
      li.appendChild(el('div', 'fx-date', t.start ? fmtDay(t.start) : 'Date to come'));
      const mid = el('div');
      mid.appendChild(el('div', 'fx-teams', t.host + ' v ' + t.visitor));
      mid.appendChild(el('div', 'fx-sub', [t.match, t.venue, t.series].filter(Boolean).join(' · ')));
      li.appendChild(mid);
      const tags = el('div', 'fx-tags');
      const live = t.start && liveFor(t);
      const pb = pickBox(t, live, t.start && sopFor(t));
      if (pb) mid.appendChild(pb);
      if (live) { const a = el('a', 'fx-tag fx-live', 'In play →'); a.href = '/#sop-title'; tags.appendChild(a); }
      if (t.wtc) tags.appendChild(el('span', 'fx-tag fx-wtc', 'WTC'));
      if (/tentative/i.test(t.status || '') || !t.start) tags.appendChild(el('span', 'fx-tag fx-tbc', 'To be confirmed'));
      li.appendChild(tags);
      ul.appendChild(li);
    });
  }

  (async function init() {
    try {
      const app = await window.CTFeatureFlags.firebaseReady;
      const fs = await import('https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js');
      const db = fs.getFirestore(app);
      const [fx, cur] = await Promise.all([
        fs.getDoc(fs.doc(db, 'liveScores', 'fixtures')),
        fs.getDoc(fs.doc(db, 'liveScores', 'current')).catch(() => null)]);
      if (!fx.exists()) throw new Error('no fixtures yet');
      const d = fx.data();
      TESTS = d.tests || [];
      LIVE = (cur && cur.exists() && (cur.data().matches || [])) || [];
      const teams = [...new Set(TESTS.flatMap(t => [t.host, t.visitor]))].sort();
      teams.forEach(x => { const o = el('option', '', x); o.value = x; $('fxTeam').appendChild(o); });
      $('fxTeam').addEventListener('change', render);
      if (d.checked) {
        $('fxNote').textContent = 'Dates are each Test’s first day, local time at the ground. Schedules change; this list was last checked ' +
          new Date(d.checked + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }) + '.';
        $('fxNote').hidden = false;
      }
      render();
    } catch (e) {
      $('fxList').textContent = '';
      $('fxList').appendChild(el('p', 'fx-empty', 'The fixtures could not be loaded. Please try again in a moment.'));
    }
  })();
})();
</script>
</body>
