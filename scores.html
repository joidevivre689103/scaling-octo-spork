<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf9f7;--surface:#ffffff;--surface2:#f5f4f2;--surface3:#eceae6;
  --border:#d8d4cc;--border2:#c8c4bc;
  --text:#1a1a18;--text2:#4a4a46;--text3:#7a7a74;
  --accent:#a03020;--accent-hover:#801810;--accent-dim:rgba(160,48,32,0.08);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden}
.main{max-width:1100px;margin:0 auto;padding:28px 32px 64px}
.page-title{font-family:'DM Serif Display',serif;font-size:34px;letter-spacing:-0.4px;margin-bottom:8px}
.page-desc{font-size:16px;line-height:1.55;color:var(--text2);max-width:680px}
.sc-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 4px}
.sc-chip{font-family:'Inter',sans-serif;font-size:12.5px;padding:6px 12px;border:1px solid var(--border2);border-radius:16px;background:var(--surface);color:var(--text2);cursor:pointer}
.sc-chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}
.sc-chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sc-chip .n{opacity:.65;margin-left:4px}
.sc-updated{margin-left:auto;font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.sc-cat{font-family:'DM Serif Display',serif;font-size:24px;margin:30px 0 4px;padding-top:10px;border-top:2px solid var(--text)}
.sc-sub{font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:14px 0 8px}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.lc{--fmt:var(--border2);background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--fmt);border-radius:4px;padding:11px 14px 13px;display:flex;flex-direction:column;gap:5px;min-width:0}
.lc.fmt-test{--fmt:#8B0000}
.lc.fmt-odi{--fmt:#1D4E89}
.lc.fmt-t20{--fmt:#1E7A55}
.lc.fmt-multi-day{--fmt:#8a6a1a}
.lc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.lc-fmt{color:var(--fmt);font-weight:600;flex:none}
.lc-tag{text-align:right;min-width:0}
.lc.is-live .lc-tag{color:var(--fmt);font-weight:600}
.lc.is-live .lc-tag::before{content:'\25CF\00A0'}
.lc-teams{font-family:'Playfair Display',serif;font-size:16.5px;font-weight:600;line-height:1.25;color:var(--text)}
.lc-sub{font-size:12px;color:var(--text3);line-height:1.4}
.lc-series{font-style:italic}
.lc-inns{font-size:14px;line-height:1.35;font-variant-numeric:tabular-nums}
.lc-inns b{font-weight:600}
.lc-ov{font-size:12px;color:var(--text3)}
.lc-state{font-size:12.5px;line-height:1.45;font-style:italic;color:var(--text2)}
.lc-next{font-size:12.5px;line-height:1.45;color:var(--text2)}
.lc-next b{font-weight:600;color:var(--text)}
.lc-foot{margin-top:auto;padding-top:8px;border-top:1px solid var(--surface3);display:flex;flex-direction:column;gap:3px}
.lc-cap{font-family:'Inter',sans-serif;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.lc-link{font-size:13px;line-height:1.4;color:var(--accent);text-decoration:none;font-weight:600}
.lc-link:hover{color:var(--accent-hover);text-decoration:underline}
.sc-empty{font-size:15px;color:var(--text2);margin-top:24px}
.sc-note{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--text3);margin-top:30px;line-height:1.5}
@media(max-width:600px){
  .main{padding:20px 16px 48px}
  .page-title{font-size:28px}
  .sc-updated{margin-left:0;flex-basis:100%}
}

<main class="main">
  <h1 class="page-title">Scores</h1>
  <p class="page-desc">Every match we follow, live and just finished: Tests first, then internationals, women’s cricket, leagues and domestic.</p>
  <div class="sc-bar" id="scBar" role="group" aria-label="Show"></div>
  <div id="scList"><p class="sc-empty">Loading scores…</p></div>
  <p class="sc-note">Scores update every 5 minutes while a Test is on, and every half hour otherwise. Start times are in your time zone.</p>
  <noscript><p class="page-desc">The scores need JavaScript.</p></noscript>

<script>
(function () {
  // Built with textContent only. Data: liveScores/all (public read).
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const CATS = [
    ['test', 'Tests'], ['international', 'Internationals'], ['women', 'Women'],
    ['league', 'Leagues'], ['domestic', 'Domestic and other'],
  ];
  const STATES = [['live', 'In play'], ['result', 'Results'], ['upcoming', 'Coming up']];
  const STALE_MS = 3 * 3600e3;     // never show readers old live scores (IJ, 2026-10-31)
  let DATA = null, shown = {}, fullCards = [], pick = '';
  try { pick = new URLSearchParams(location.search).get('show') || ''; } catch (e) { /* fine */ }

  const fig = i => ((i.wickets === 10 || i.wickets == null) ? String(i.runs) : i.runs + '/' + i.wickets) + (i.declared ? 'd' : '');
  const fmtOf = m => m.format || (m.tier === 'test' ? 'test' : '');
  const fmtLabel = m => {
    const f = fmtOf(m);
    if (/hundred/i.test(m.competition || '')) return '100 balls';
    return f === 'test' ? 'Test' : f === 'odi' ? '50 overs' : f === 't20' ? 'T20' : f === 'multi-day' ? 'Multi-day' : 'Match';
  };
  const tag = m => m.state === 'upcoming' ? 'Upcoming' : m.state === 'result' ? 'Result'
    : [m.dayLabel, m.dayState].filter(Boolean).join(' · ') || 'In play';
  const when = iso => {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + ', ' +
      d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
  };
  // Day N+1 of a Test at stumps, as on the homepage (no guess once it has passed).
  const nextDay = m => {
    if (m.tier !== 'test' || m.state !== 'live' || !/stumps|end of day/i.test(String(m.dayState || ''))) return null;
    const first = new Date(m.startsAt);
    const n = parseInt(String(m.dayLabel || '').replace(/\D/g, ''), 10);
    if (isNaN(first) || !n || n >= 5) return null;
    const next = new Date(first.getTime() + n * 864e5);
    return next.getTime() < Date.now() ? null : { label: 'Day ' + (n + 1), when: when(next.toISOString()) };
  };
  const byTeam = m => {
    const inns = Array.isArray(m.innings) ? m.innings : [];
    if (!m.inningsAttributed || !inns.length) return null;
    const order = [];
    inns.forEach(i => { if (i.team && !order.includes(i.team)) order.push(i.team); });
    return order.map(t => ({ team: t, inns: inns.filter(i => i.team === t) }));
  };
  const teamKey = ts => (ts || []).map(x => String(x).toLowerCase()).sort().join('|');
  const dayMs = s => Date.parse(String(s || '').slice(0, 10) + 'T00:00:00Z');
  const shownFor = m => Object.values(shown).find(v => v && teamKey(v.teams) === teamKey(m.teams)
    && Math.abs(dayMs(v.start) - dayMs(m.startsAt)) <= 864e5);
  const inFull = m => fullCards.some(v => v && teamKey(v.teams) === teamKey(m.teams)
    && Math.abs(dayMs(v.start) - dayMs(m.startsAt)) <= 3 * 864e5);

  function card(m) {
    const c = el('article', 'lc' + (fmtOf(m) ? ' fmt-' + fmtOf(m) : '') + (m.state === 'live' ? ' is-live' : ''));
    const top = el('div', 'lc-top');
    top.appendChild(el('span', 'lc-fmt', fmtLabel(m)));
    top.appendChild(el('span', 'lc-tag', tag(m)));
    c.appendChild(top);
    c.appendChild(el('h3', 'lc-teams', (m.teams || []).join(' v ')));
    const venue = (m.venue || '').split(',')[0].trim();
    const where = [m.matchLabel, venue].filter(Boolean).join(' · ');
    if (where) c.appendChild(el('p', 'lc-sub', where));
    const series = String(m.competition || '').replace(/,?\s*\d{4}(-\d{2,4})?$/, '').replace(/\bWomens\b/g, 'Women’s').trim();
    if (series) c.appendChild(el('p', 'lc-sub lc-series', series));
    if (m.state === 'upcoming') {
      c.appendChild(el('p', 'lc-state', 'Starts ' + when(m.startsAt)));
      return c;
    }
    const rows = byTeam(m);
    if (rows) rows.forEach(r => {
      const p = el('p', 'lc-inns');
      p.appendChild(el('b', '', r.team));
      p.appendChild(document.createTextNode(' '));
      r.inns.forEach((i, k) => {
        if (k) p.appendChild(document.createTextNode(' & '));
        p.appendChild(document.createTextNode(fig(i)));
        if (i.overs != null && i.overs !== '') p.appendChild(el('span', 'lc-ov', ' (' + i.overs + ' ov)'));
      });
      c.appendChild(p);
    });
    else if (m.summary) c.appendChild(el('p', 'lc-inns', m.summary));
    const st = m.state === 'result' ? m.result : (m.statusNote || m.toss);
    if (st) c.appendChild(el('p', 'lc-state', st));
    const nd = nextDay(m);
    if (nd) {
      const p = el('p', 'lc-next');
      p.appendChild(el('b', '', nd.label + ' starts '));
      p.appendChild(document.createTextNode(nd.when + ' (scheduled)'));
      c.appendChild(p);
    }
    // Tests: the scorecard for subscribers, exactly as on the homepage.
    const teams2 = m.teams || [];
    if (m.tier === 'test' && teams2.length === 2 && m.startsAt) {
      const ours = shownFor(m);
      const full = m.state === 'result' && (inFull(m) || !!(ours && (ours.result || ours.final)));
      let text = null;
      if (full) text = 'See the full scorecard →';
      else if (ours && ours.result) text = 'Full scorecard (' + ours.result.charAt(0).toLowerCase() + ours.result.slice(1) + ') →';
      else if (ours) text = 'Scorecard so far' + (ours.asOf ? ' (' + ours.asOf.toLowerCase() + ')' : '') + (m.state === 'result' ? '; full scorecard soon' : '') + ' →';
      const foot = el('div', 'lc-foot');
      if (text) {
        foot.appendChild(el('span', 'lc-cap', 'For subscribers'));
        const a = el('a', 'lc-link', text);
        a.href = '/countries.html?find=' + encodeURIComponent(teams2.join('|') + '|' + String(m.startsAt).slice(0, 10));
        foot.appendChild(a);
        c.appendChild(foot);
      } else if (m.state === 'result') {
        foot.appendChild(el('span', 'lc-cap', 'Full scorecard soon'));
        c.appendChild(foot);
      }
    }
    return c;
  }

  // Order within a group: Tests further in first, then by start (live and
  // upcoming soonest first, results latest first), then by teams.
  const order = (a, b, state) => {
    const da = parseInt(String(a.dayLabel || '').replace(/\D/g, ''), 10) || 0;
    const db = parseInt(String(b.dayLabel || '').replace(/\D/g, ''), 10) || 0;
    const ta = Date.parse(a.startsAt) || 0, tb = Date.parse(b.startsAt) || 0;
    return (db - da) || (state === 'result' ? tb - ta : ta - tb)
      || (a.teams || []).join().localeCompare((b.teams || []).join());
  };

  function render() {
    const box = $('scList'), bar = $('scBar');
    box.textContent = ''; bar.textContent = '';
    const updated = DATA.updatedAt && DATA.updatedAt.toDate ? DATA.updatedAt.toDate() : null;
    const stale = !updated || Date.now() - updated.getTime() > STALE_MS;
    // Old live scores are never shown; upcoming matches still are.
    const all = (DATA.matches || []).filter(m => !(stale && m.state !== 'upcoming'));
    const count = k => all.filter(m => (m.category || 'domestic') === k).length;
    const chip = (key, label, n) => {
      const b = el('button', 'sc-chip', label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(pick === key));
      if (n != null) b.appendChild(el('span', 'n', String(n)));
      b.addEventListener('click', () => {
        pick = key;
        try { const u = new URL(location.href); if (key) u.searchParams.set('show', key); else u.searchParams.delete('show'); history.replaceState(null, '', u); } catch (e) { /* fine */ }
        render();
      });
      bar.appendChild(b);
    };
    chip('', 'All', all.length);
    CATS.forEach(([k, label]) => { const n = count(k); if (n) chip(k, label, n); });
    const up = el('span', 'sc-updated');
    if (updated) {
      const min = Math.max(0, Math.round((Date.now() - updated.getTime()) / 60000));
      up.textContent = 'Updated ' + (min < 1 ? 'just now' : min < 60 ? min + ' min ago' : Math.floor(min / 60) + ' h ago');
      up.title = updated.toLocaleString();
    }
    bar.appendChild(up);
    if (stale) box.appendChild(el('p', 'sc-empty', 'Live scores are taking a short break and will be back soon.'));
    let any = false;
    CATS.filter(([k]) => !pick || pick === k).forEach(([k, label]) => {
      const inCat = all.filter(m => (m.category || 'domestic') === k);
      if (!inCat.length) return;
      any = true;
      box.appendChild(el('h2', 'sc-cat', label));
      STATES.forEach(([s, sLabel]) => {
        const list = inCat.filter(m => m.state === s).sort((a, b) => order(a, b, s));
        if (!list.length) return;
        box.appendChild(el('h3', 'sc-sub', sLabel));
        const grid = el('div', 'sc-grid');
        list.forEach(m => grid.appendChild(card(m)));
        box.appendChild(grid);
      });
    });
    if (!any && !stale) box.appendChild(el('p', 'sc-empty', pick ? 'Nothing here right now.' : 'No matches right now.'));
  }

  (async function init() {
    try {
      const app = await window.CTFeatureFlags.firebaseReady;
      const fs = await import('https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js');
      const db = fs.getFirestore(app);
      const load = async () => {
        const [all, sc, home] = await Promise.all([
          fs.getDoc(fs.doc(db, 'liveScores', 'all')),
          fs.getDoc(fs.doc(db, 'liveScores', 'scorecardsShown')).catch(() => null),
          fs.getDoc(fs.doc(db, 'liveScores', 'home')).catch(() => null)]);
        if (!all.exists()) throw new Error('no scores yet');
        DATA = all.data() || {};
        shown = (sc && sc.exists() && sc.data().tests) || {};
        fullCards = (home && home.exists() && home.data().fullCards) || [];
        render();
      };
      await load();
      // An open page keeps up: every 2 minutes while it is on screen.
      setInterval(() => { if (!document.hidden) load().catch(() => {}); }, 120000);
    } catch (e) {
      $('scList').textContent = '';
      $('scList').appendChild(el('p', 'sc-empty', 'The scores could not be loaded. Please try again in a moment.'));
    }
  })();
})();
</script>
