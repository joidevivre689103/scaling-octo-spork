*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden}
.main{max-width:1100px;margin:0 auto;padding:28px 32px 64px}

.access-key{font-family:'Inter',sans-serif;font-size:12px;color:var(--text3);margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px}

.sec-title{font-family:'DM Serif Display',serif;font-size:25px;margin:34px 0 4px;padding-top:10px;border-top:2px solid var(--text)}
.sec-desc{font-size:15px;color:var(--text2);margin-bottom:16px;max-width:640px;line-height:1.5}
.pg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pg-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:20px 20px 16px;display:flex;flex-direction:column;scroll-margin-top:60px}
.pg-card.wide{grid-column:1/-1}
.pg-card:target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.pg-card .ctp-blurb{font-size:15.5px;margin:8px 0 12px}
.pg-card .ctp-qs{margin-bottom:14px}
.pg-card.wide .ctp-inside{columns:2;column-gap:28px}
.pg-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pg-title{font-family:'DM Serif Display',serif;font-size:23px;font-weight:400;line-height:1.15}
.pg-title a{color:var(--text);text-decoration:none}
.pg-title a:hover{color:var(--accent)}
.pg-tier{display:inline-block;flex-shrink:0;padding:3px 9px;border-radius:12px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.tier-free{background:var(--green-dim);color:var(--green)}
.tier-account{background:var(--gold-dim);color:var(--gold)}
.tier-paid{background:var(--accent-dim);color:var(--accent)}
.pg-tier .yours{font-weight:600;opacity:.8}
.pg-foot{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pg-cta{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;letter-spacing:.3px;color:#fff;background:var(--accent);text-decoration:none;padding:9px 15px;border-radius:7px}
.pg-cta:hover{background:var(--accent-hover)}
.pg-card[data-locked] .pg-cta{background:var(--text)}
.pg-card[data-locked] .pg-cta:hover{background:#3a3a36}
.pg-alt{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--text3)}
.pg-alt a{color:var(--accent)}
.pg-fine{font-family:'Inter',sans-serif;font-size:12px;color:var(--text3);margin-top:8px}
.pg-site{list-style:none;font-size:15px;line-height:1.5;columns:2;column-gap:28px}
.pg-site li{padding:6px 0;border-top:1px solid var(--surface3);break-inside:avoid}
.pg-site a{color:var(--accent);font-weight:600;text-decoration:none}
.pg-site a:hover{text-decoration:underline}
.pg-site span{color:var(--text2)}
@media(max-width:820px){
  .pg-grid{grid-template-columns:1fr}
  .pg-card.wide .ctp-inside{columns:1}

@media(max-width:600px){

}
