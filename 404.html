<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Page not found (GitHub Pages serves this for any missing address).
     Also the fallback for share previews (IJ, 2026-11-13): an article's
     /a/<n>/ preview page is written by the Share previews workflow a minute
     or two after publishing, so a link shared before then lands here and is
     forwarded to the article. -->
<title>Page not found — The Grass Bank™</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<script>
(function () {
  var m = location.pathname.match(/^\/a\/(\d+)\/?(?:index\.html)?$/);
  if (m) location.replace('/article.html?id=' + m[1] + location.hash);
})();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:24px;text-align:center;background:#fbf8f1;color:#2b2b2b;font-family:Georgia,serif}
  h1{font-weight:normal;font-size:28px;margin:0 0 12px}
  p{font-size:17px;line-height:1.5;margin:0}
  a{color:#2f6b3a}
</style>
</head>
<body>
<main>
  <h1>This page isn't here</h1>
  <p>The address may be mistyped, or the page has moved. <a href="/">Go to The Grass Bank</a>.</p>
</main>
</body>
</html>
